<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>School Board</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #20242a;
      color: white;
      padding: 24px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 5px 0 0;
      color: #c5c8cc;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .welcome,
    .post-form,
    .post {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .welcome h2 {
      margin-top: 0;
    }

    .welcome button,
    .post-form button {
      background: #20242a;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    .post-form {
      display: none;
    }

    .post-form input,
    .post-form textarea,
    .post-form select {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .post-form textarea {
      height: 120px;
      resize: vertical;
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .categories button {
      border: 1px solid #ddd;
      background: white;
      padding: 9px 13px;
      border-radius: 20px;
      cursor: pointer;
    }

    .category {
      display: inline-block;
      font-size: 12px;
      color: #666;
      background: #f0f1f3;
      padding: 5px 9px;
      border-radius: 10px;
    }

    .post h3 {
      margin: 12px 0 7px;
    }

    .post p {
      color: #555;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .post-info {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 30px;
    }
  </style>
</head>

<body>

<header>
  <h1>School Board</h1>
  <p>みんなの学校掲示板</p>
</header>

<main>

  <section class="welcome">
    <h2>今日の掲示板</h2>
    <p>学校のみんなで情報を共有しよう。</p>

    <button id="openPost">＋ 投稿する</button>
  </section>


  <!-- 投稿フォーム -->

  <section class="post-form" id="postForm">

    <h2>新しい投稿</h2>

    <label>タイトル</label>

    <input
      type="text"
      id="title"
      placeholder="タイトルを入力"
      maxlength="100"
    >

    <label>カテゴリ</label>

    <select id="category">
      <option value="学校生活">🏫 学校生活</option>
      <option value="お知らせ">📢 お知らせ</option>
      <option value="勉強">📚 勉強</option>
      <option value="音楽">🎸 音楽</option>
      <option value="ゲーム">🎮 ゲーム</option>
      <option value="雑談">💬 雑談</option>
    </select>

    <label>本文</label>

    <textarea
      id="content"
      placeholder="投稿内容を入力"
      maxlength="1000"
    ></textarea>

    <button id="submitPost">投稿する</button>

  </section>


  <!-- カテゴリ -->

  <div class="categories">
    <button>📢 お知らせ</button>
    <button>🏫 学校生活</button>
    <button>📚 勉強</button>
    <button>🎸 音楽</button>
    <button>🎮 ゲーム</button>
    <button>💬 雑談</button>
  </div>


  <!-- 投稿一覧 -->

  <section>

    <h2>最新の投稿</h2>

    <div id="posts">
      <div class="empty">投稿を読み込んでいます...</div>
    </div>

  </section>

</main>


<script type="module">

  // Firebase
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  // Firebase設定

  const firebaseConfig = {
    apiKey: "AIzaSyCCbUAvRjKdpjl8CZKrLgqjFmsYbaOGXPw",
    authDomain: "school-board-44852.firebaseapp.com",
    projectId: "school-board-44852",
    storageBucket: "school-board-44852.firebasestorage.app",
    messagingSenderId: "852363319361",
    appId: "1:852363319361:web:09db7e1dc937dd89444ec0"
  };


  // Firebaseを起動

  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  // 投稿フォームを開く

  const openPost = document.getElementById("openPost");
  const postForm = document.getElementById("postForm");

  openPost.addEventListener("click", () => {

    postForm.style.display = "block";

    postForm.scrollIntoView({
      behavior: "smooth"
    });

  });


  // 投稿する

  const submitPost = document.getElementById("submitPost");

  submitPost.addEventListener("click", async () => {

    const title =
      document.getElementById("title").value.trim();

    const category =
      document.getElementById("category").value;

    const content =
      document.getElementById("content").value.trim();


    // 空欄チェック

    if (!title || !content) {

      alert("タイトルと本文を入力してください。");

      return;
    }


    try {

      submitPost.disabled = true;

      submitPost.textContent = "投稿中...";


      // Firestoreに保存

      await addDoc(collection(db, "posts"), {

        title: title,

        category: category,

        content: content,

        author: "匿名",

        createdAt: serverTimestamp()

      });


      // 入力欄を空にする

      document.getElementById("title").value = "";

      document.getElementById("content").value = "";


      alert("投稿しました！");


    } catch (error) {

      console.error(error);

      alert("投稿に失敗しました。\n" + error.message);

    }


    submitPost.disabled = false;

    submitPost.textContent = "投稿する";

  });


  // 投稿をリアルタイム取得

  const postsQuery = query(

    collection(db, "posts"),

    orderBy("createdAt", "desc")

  );


  onSnapshot(postsQuery, (snapshot) => {

    const posts = document.getElementById("posts");

    posts.innerHTML = "";


    if (snapshot.empty) {

      posts.innerHTML =
        '<div class="empty">まだ投稿がありません。</div>';

      return;

    }


    snapshot.forEach((doc) => {

      const data = doc.data();

      const article = document.createElement("article");

      article.className = "post";


      const category =
        document.createElement("span");

      category.className = "category";

      category.textContent = data.category;


      const title =
        document.createElement("h3");

      title.textContent = data.title;


      const content =
        document.createElement("p");

      content.textContent = data.content;


      const info =
        document.createElement("div");

      info.className = "post-info";

      info.textContent =
        "匿名 ・ " + formatDate(data.createdAt);


      article.appendChild(category);
      article.appendChild(title);
      article.appendChild(content);
      article.appendChild(info);

      posts.appendChild(article);

    });

  });


  // 日付表示

  function formatDate(timestamp) {

    if (!timestamp) {
      return "たった今";
    }

    const date = timestamp.toDate();

    return date.toLocaleString("ja-JP", {
      month: "numeric",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });

  }

</script>

</body>
</html>
