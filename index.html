<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Board</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>School Board</h1>
    <p>みんなの学校掲示板</p>
  </header>

  <main>

    <section class="welcome">
      <h2>今日の掲示板</h2>
      <p>学校のみんなで情報を共有しよう。</p>
      <button>＋ 投稿する</button>
    </section>

    <div class="categories">
      <button>📢 お知らせ</button>
      <button>🏫 学校生活</button>
      <button>📚 勉強</button>
      <button>🎸 音楽</button>
      <button>🎮 ゲーム</button>
      <button>💬 雑談</button>
    </div>

    <section class="posts">

      <h2>最新の投稿</h2>

      <article class="post">
        <span class="category">学校生活</span>
        <h3>明日の持ち物って何だっけ？</h3>
        <p>明日の授業で必要なもの分かる人いますか？</p>
        <div class="post-info">
          匿名 ・ 10分前
        </div>
      </article>

      <article class="post">
        <span class="category">音楽</span>
        <h3>文化祭のバンドについて</h3>
        <p>文化祭で演奏する曲について話そう！</p>
        <div class="post-info">
          匿名 ・ 25分前
        </div>
      </article>

      <article class="post">
        <span class="category">ゲーム</span>
        <h3>放課後ゲームできる人</h3>
        <p>今日一緒に遊べる人募集。</p>
        <div class="post-info">
          匿名 ・ 1時間前
        </div>
      </article>

    </section>

  </main>

  <footer>
    <p>School Board</p>
  </footer>

</body>
</html>
